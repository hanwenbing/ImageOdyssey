<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Transformer 架构教学版示意图</title>
  <desc id="desc">展示 Transformer 的编码器、解码器、注意力层、前馈网络、残差连接与输出层。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .encoder { fill: #eff6ff; stroke: #60a5fa; }
      .decoder { fill: #fff7ed; stroke: #fb923c; }
      .block { stroke-width: 2; rx: 16; filter: url(#shadow); }
      .emb { fill: #dcfce7; stroke: #22c55e; }
      .attn { fill: #dbeafe; stroke: #3b82f6; }
      .masked { fill: #ede9fe; stroke: #8b5cf6; }
      .cross { fill: #e0f2fe; stroke: #0284c7; }
      .ffn { fill: #fef3c7; stroke: #f59e0b; }
      .norm { fill: #f1f5f9; stroke: #94a3b8; }
      .out { fill: #fee2e2; stroke: #ef4444; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #475569; }
      .h2 { font-size: 26px; font-weight: 800; }
      .h3 { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; fill: #334155; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .arrow-dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .residual { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="920"/>

  <text class="label title" x="700" y="58" text-anchor="middle">Transformer 架构教学版</text>
  <text class="label subtitle" x="700" y="88" text-anchor="middle">Encoder 负责理解输入序列，Decoder 结合已生成内容与 Encoder 表示逐步生成输出</text>

  <rect class="panel encoder" x="80" y="130" width="560" height="650" rx="28"/>
  <rect class="panel decoder" x="760" y="130" width="560" height="650" rx="28"/>
  <text class="label h2" x="360" y="176" text-anchor="middle">Encoder 编码器 × N</text>
  <text class="label h2" x="1040" y="176" text-anchor="middle">Decoder 解码器 × N</text>

  <rect class="block emb" x="180" y="700" width="360" height="52" rx="16"/>
  <text class="label h3" x="360" y="731" text-anchor="middle">输入词向量 + 位置编码</text>

  <rect class="block attn" x="180" y="560" width="360" height="64" rx="16"/>
  <text class="label h3" x="360" y="586" text-anchor="middle">多头自注意力</text>
  <text class="label small" x="360" y="608" text-anchor="middle">每个 token 看见整个输入序列</text>

  <rect class="block norm" x="180" y="488" width="360" height="44" rx="14"/>
  <text class="label h3" x="360" y="516" text-anchor="middle">Add &amp; Norm</text>

  <rect class="block ffn" x="180" y="350" width="360" height="64" rx="16"/>
  <text class="label h3" x="360" y="376" text-anchor="middle">前馈网络 FFN</text>
  <text class="label small" x="360" y="398" text-anchor="middle">逐位置非线性变换</text>

  <rect class="block norm" x="180" y="278" width="360" height="44" rx="14"/>
  <text class="label h3" x="360" y="306" text-anchor="middle">Add &amp; Norm</text>

  <rect class="chip" x="260" y="214" width="200" height="38" rx="12"/>
  <text class="label body" x="360" y="239" text-anchor="middle">输出：上下文表示</text>

  <path class="arrow" d="M360 700 L360 630"/>
  <path class="arrow" d="M360 560 L360 536"/>
  <path class="arrow" d="M360 488 L360 420"/>
  <path class="arrow" d="M360 350 L360 326"/>
  <path class="arrow" d="M360 278 L360 256"/>

  <path class="residual" d="M540 592 C600 592 600 510 545 510"/>
  <text class="label tiny" x="595" y="552" text-anchor="middle">残差</text>
  <path class="residual" d="M540 382 C600 382 600 300 545 300"/>
  <text class="label tiny" x="595" y="342" text-anchor="middle">残差</text>

  <rect class="block emb" x="860" y="700" width="360" height="52" rx="16"/>
  <text class="label h3" x="1040" y="731" text-anchor="middle">输出词向量 + 位置编码</text>

  <rect class="block masked" x="860" y="590" width="360" height="64" rx="16"/>
  <text class="label h3" x="1040" y="616" text-anchor="middle">Masked 多头自注意力</text>
  <text class="label small" x="1040" y="638" text-anchor="middle">只能看见已生成 token</text>

  <rect class="block norm" x="860" y="524" width="360" height="42" rx="14"/>
  <text class="label h3" x="1040" y="551" text-anchor="middle">Add &amp; Norm</text>

  <rect class="block cross" x="860" y="430" width="360" height="64" rx="16"/>
  <text class="label h3" x="1040" y="456" text-anchor="middle">Encoder-Decoder 注意力</text>
  <text class="label small" x="1040" y="478" text-anchor="middle">Query 来自 Decoder，Key/Value 来自 Encoder</text>

  <rect class="block norm" x="860" y="364" width="360" height="42" rx="14"/>
  <text class="label h3" x="1040" y="391" text-anchor="middle">Add &amp; Norm</text>

  <rect class="block ffn" x="860" y="270" width="360" height="64" rx="16"/>
  <text class="label h3" x="1040" y="296" text-anchor="middle">前馈网络 FFN</text>
  <text class="label small" x="1040" y="318" text-anchor="middle">逐位置非线性变换</text>

  <rect class="block norm" x="860" y="204" width="360" height="42" rx="14"/>
  <text class="label h3" x="1040" y="231" text-anchor="middle">Add &amp; Norm</text>

  <rect class="block out" x="860" y="110" width="360" height="58" rx="16"/>
  <text class="label h3" x="1040" y="134" text-anchor="middle">线性层 + Softmax</text>
  <text class="label small" x="1040" y="154" text-anchor="middle">得到下一个 token 的概率分布</text>

  <path class="arrow" d="M1040 700 L1040 660"/>
  <path class="arrow" d="M1040 590 L1040 570"/>
  <path class="arrow" d="M1040 524 L1040 500"/>
  <path class="arrow" d="M1040 430 L1040 410"/>
  <path class="arrow" d="M1040 364 L1040 340"/>
  <path class="arrow" d="M1040 270 L1040 250"/>
  <path class="arrow" d="M1040 204 L1040 174"/>

  <path class="residual" d="M1220 622 C1288 622 1288 545 1226 545"/>
  <text class="label tiny" x="1292" y="585" text-anchor="middle">残差</text>
  <path class="residual" d="M1220 462 C1288 462 1288 385 1226 385"/>
  <text class="label tiny" x="1292" y="425" text-anchor="middle">残差</text>
  <path class="residual" d="M1220 302 C1288 302 1288 225 1226 225"/>
  <text class="label tiny" x="1292" y="265" text-anchor="middle">残差</text>

  <path class="arrow-blue" d="M460 233 C675 233 675 462 852 462"/>
  <text class="label body" x="700" y="442" text-anchor="middle" fill="#2563eb">Encoder 输出作为 Key / Value</text>

  <rect class="chip" x="110" y="818" width="250" height="44" rx="14"/>
  <text class="label body" x="235" y="845" text-anchor="middle">源序列：I love NLP</text>
  <path class="arrow" d="M235 818 L300 756"/>

  <rect class="chip" x="820" y="818" width="270" height="44" rx="14"/>
  <text class="label body" x="955" y="845" text-anchor="middle">目标序列：&lt;BOS&gt; 我...</text>
  <path class="arrow" d="M955 818 L1010 756"/>

  <rect class="chip" x="1115" y="818" width="180" height="44" rx="14"/>
  <text class="label body" x="1205" y="845" text-anchor="middle">下一个 token</text>
  <path class="arrow" d="M1110 818 C1110 760 1090 210 1068 172"/>

  <g transform="translate(80 805)">
    <rect class="chip" x="0" y="0" width="640" height="84" rx="18"/>
    <text class="label h3" x="24" y="30">阅读顺序</text>
    <text class="label body" x="24" y="58">1. 输入 token 进入 Encoder，得到上下文表示。</text>
    <text class="label body" x="340" y="58">2. Decoder 用 Mask 防止偷看未来 token。</text>
    <text class="label body" x="24" y="78">3. Cross Attention 读取 Encoder 表示，逐步预测下一个 token。</text>
  </g>

  <g transform="translate(1130 30)">
    <rect class="chip" x="0" y="0" width="190" height="84" rx="16"/>
    <circle cx="18" cy="24" r="7" fill="#3b82f6"/>
    <text class="label small" x="34" y="28">注意力层</text>
    <circle cx="18" cy="48" r="7" fill="#f59e0b"/>
    <text class="label small" x="34" y="52">前馈网络</text>
    <circle cx="18" cy="70" r="7" fill="#94a3b8"/>
    <text class="label small" x="34" y="74">Add &amp; Norm</text>
  </g>
</svg>
